[package]
name = "deepgraph"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "deepgraph"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.22"
tree-sitter-java = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-md = "0.3"
ignore = "0.4"
globset = "0.4"
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
